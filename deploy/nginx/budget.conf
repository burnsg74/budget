# budget.localhost -> static SPA build + /api proxy to the node:http API (pm2 `budget-api`, port 4001).
# Symlinked into /opt/homebrew/etc/nginx/servers/ by deploy/setup.sh.
server {
    listen 80;
    listen [::]:80;
    server_name budget.localhost;

    root /Users/greg/Code/Local/4001-budget/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 6m;
    }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: deep links like /accounts/Home%20Loan return index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
